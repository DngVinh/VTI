          "type": { "$ref": "#/components/schemas/QuestionType" }
        }
      },
      "SemanticDuplicateRequest": {
        "type": "object", "additionalProperties": false, "required": ["target"],
        "properties": {
          "target": { "$ref": "#/components/schemas/SemanticDuplicateTarget" },
          "questionId": { "$ref": "#/components/schemas/ObjectId" },
          "versionNumber": { "type": "integer", "minimum": 1 },
          "draft": { "type": "object" },
          "threshold": { "type": "number", "minimum": 0.5, "maximum": 0.99, "default": 0.75 },
          "topK": { "type": "integer", "minimum": 1, "maximum": 20, "default": 10 },
          "filters": { "$ref": "#/components/schemas/SemanticDuplicateFilter" }
        }
      },
      "SemanticDuplicateMatch": {
        "type": "object", "additionalProperties": false, "required": ["questionId", "versionNumber", "code", "title", "similarityScore", "matchReason", "taxonomyOverlap", "status"],
        "properties": {
          "questionId": { "$ref": "#/components/schemas/ObjectId" },
          "versionNumber": { "type": "integer" },
          "code": { "type": "string" },
          "title": { "$ref": "#/components/schemas/LocalizedPrompt" },
          "similarityScore": { "type": "number" },
          "matchReason": { "type": "string", "enum": ["EXACT_FINGERPRINT", "SEMANTIC_SIMILARITY"] },
          "taxonomyOverlap": { "type": "number" },
          "status": { "$ref": "#/components/schemas/VersionStatus" }
        }
      },
      "SemanticDuplicateResponse": {
        "type": "object", "additionalProperties": false, "required": ["success", "data", "requestId"],
        "properties": {
          "success": { "const": true },
          "data": {
            "type": "object", "additionalProperties": false, "required": ["matches", "totalMatches", "thresholdUsed"],
            "properties": {
              "matches": { "type": "array", "items": { "$ref": "#/components/schemas/SemanticDuplicateMatch" } },
              "totalMatches": { "type": "integer" },
              "thresholdUsed": { "type": "number" }
            }
          },
          "requestId": { "type": "string" }
        }
      },
      "ErrorCode": {
        "type": "string",
        "enum": ["VALIDATION_ERROR", "AUTH_UNAUTHORIZED", "AUTH_FORBIDDEN", "QUESTION_BANK_FEATURE_DISABLED", "QUESTION_NOT_FOUND", "QUESTION_VERSION_NOT_FOUND", "QUESTION_REVISION_CONFLICT", "QUESTION_VERSION_IMMUTABLE", "QUESTION_ACTIVE_DRAFT_EXISTS", "QUESTION_INVALID_STATE_TRANSITION", "QUESTION_CODE_CONFLICT", "QUESTION_CONTENT_INCOMPLETE", "QUESTION_FOUR_EYES_VIOLATION", "QUESTION_REVIEW_NOT_FOUND", "IDEMPOTENCY_KEY_REUSED", "IDEMPOTENCY_REQUEST_IN_PROGRESS", "PRECONDITION_REQUIRED", "QUESTION_SELECTION_FAILED", "QUESTION_IMPORT_VALIDATION_FAILED", "AI_PROVIDER_ERROR", "AI_PROVIDER_RATE_LIMIT", "AI_PROVIDER_TIMEOUT", "AI_PROVIDER_SCHEMA_ERROR", "QUESTION_TRANSLATION_SOURCE_MISSING", "QUESTION_TRANSLATION_OVERWRITE_CONFIRMATION_REQUIRED", "QUESTION_TRANSLATION_SCHEMA_ERROR", "QUESTION_TRANSLATION_DISABLED", "QUESTION_EMBEDDING_PROVIDER_UNAVAILABLE", "QUESTION_EMBEDDING_INVALID_DIMENSIONS", "QUESTION_EMBEDDING_BACKFILL_IN_PROGRESS", "QUESTION_EMBEDDING_BACKFILL_DISABLED", "QUESTION_SEMANTIC_SEARCH_DISABLED", "QUESTION_SEMANTIC_SEARCH_UNAVAILABLE", "QUESTION_DUPLICATE_QUERY_INVALID", "INTERNAL_SERVER_ERROR"]
      },
      "ErrorResponse": {
        "type": "object", "additionalProperties": false, "required": ["success", "message", "code", "requestId"],
        "properties": {
          "success": { "const": false },
          "message": { "type": "string" },
          "code": { "$ref": "#/components/schemas/ErrorCode" },
          "errors": { "type": "array", "items": { "$ref": "#/components/schemas/ValidationErrorDetail" } },
          "requestId": { "type": "string" }
        }
      }
    }
  }
}
